name: Release notes

# After the "Publish packages" workflow has published a vX.Y.Z tag (nuget.org + GitHub Release),
# copy that GitHub Release's notes into the docs site (docs/.../reference/release-notes.md) and
# open a PR against main and enable auto-merge on it. Merging the PR triggers the Docs workflow, which redeploys the site.
#
# One-time setup: repo Settings > Actions > General > Workflow permissions:
#   "Allow GitHub Actions to create and approve pull requests".
#
# Run manually (Actions > Release notes > Run workflow) to backfill an older tag.
on:
  workflow_run:
    workflows: ['Publish packages']
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, e.g. v1.3.1'
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  release-notes:
    # Only after a successful publish run that was triggered by a tag push (not a branch run).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.inputs.tag || github.event.workflow_run.head_branch }}
    steps:
      - name: Validate tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "'$TAG' is not a valid release tag (expected vX.Y.Z)" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch release notes
        id: notes
        run: |
          gh release view "$TAG" --json body,isPrerelease,publishedAt \
            --jq '.body' > "$RUNNER_TEMP/notes.md"
          PRERELEASE=$(gh release view "$TAG" --json isPrerelease --jq '.isPrerelease')
          DATE=$(gh release view "$TAG" --json publishedAt --jq '.publishedAt[:10]')
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

      - name: Update release notes page
        run: |
          ARGS=(--date "${{ steps.notes.outputs.date }}")
          if [ "${{ steps.notes.outputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          node docs/scripts/add-release-notes.mjs "$TAG" "$RUNNER_TEMP/notes.md" "${ARGS[@]}"

      - name: Open pull request
        run: |
          if git diff --quiet; then
            echo "Release notes for $TAG are already up to date."
            exit 0
          fi
          BRANCH="release-notes/$TAG"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/src/content/docs/reference/release-notes.md
          git commit -m "Docs: add release notes for $TAG"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "Docs: release notes for $TAG" \
              --body "Adds the [$TAG release notes](https://github.com/${{ github.repository }}/releases/tag/$TAG) to the docs site. Generated by the Release notes workflow; merging redeploys the docs."
          fi
          # Merge automatically once any required checks pass (needs "Allow auto-merge" in repo settings).
          gh pr merge "$BRANCH" --auto --squash
